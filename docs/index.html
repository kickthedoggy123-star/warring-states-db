<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>戰國史料資料庫</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">

    <header class="container">
      <h1>戰國史料資料庫</h1>
      <p>依西元前年排列之戰國編年資料檢索</p>
    </header>

    <div class="search-area">
      <input id="searchBox" placeholder="搜尋年份、人物、國家、事件">
      <button onclick="searchData()">搜尋</button>
      <button onclick="showAll()">顯示全部</button>
    </div>

    <main class="reader-layout">

      <aside class="year-panel">
        <h2>年份索引</h2>
        <div id="yearList"></div>
      </aside>

      <section class="content-panel">
        <h2 id="resultTitle">事件內容</h2>

        <table>
          <thead>
            <tr>
              <th>西元前年</th>
              <th>紀年標題</th>
              <th>國家</th>
              <th>人物</th>
              <th>事件詞</th>
              <th>原文內容</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </section>

    </main>

    </div>

  <footer class="site-footer">

    <p>
    本資料庫初版內容及案語主要整理自楊寬先生《戰國史料編年輯證》。本網站僅供學術研究與教學參考，不作任何商業或營利用途。如涉及著作權相關事宜，請與網站管理者聯繫。

    </p>

  </footer>

  <script src="app.js"></script>
</body>
</html>
